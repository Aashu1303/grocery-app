name: Record screenshots

# Re-records Roborazzi golden images and commits them to the branch, so every golden change is a reviewed diff.
# It must run on the same kind of runner as CI (ADR 0025): goldens rendered on another OS would not match.
# Run it manually, or push a commit whose message contains "[record screenshots]".
on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  record:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[record screenshots]')
    runs-on: ${{ fromJSON(vars.RASOI_RUNNER || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v3
      - run: ./gradlew recordRoborazziJvm -Prasoi.ios=false
      - name: Commit goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '**/screenshots/*.png'
          if git diff --cached --quiet; then echo "No screenshot changes."; exit 0; fi
          git commit -m "test: record screenshot goldens"
          # The branch may have moved while recording; goldens only touch screenshot files, so rebase and retry.
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
