name: Record screenshots

# Re-records Roborazzi golden images and commits them to the branch, so every golden change is a reviewed diff.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew recordRoborazziJvm
      - name: Commit goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '**/screenshots/*.png'
          if git diff --cached --quiet; then echo "No screenshot changes."; exit 0; fi
          git commit -m "test(designsystem): record screenshot goldens"
          git push
