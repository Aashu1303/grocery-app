name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  # Every pushed commit gets a full result (milestone tags need one); superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  guard:
    name: Privacy and resource guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-no-real-invoices.sh
      - run: python3 scripts/check-compose-resources.py

  check:
    name: Build, lint and test (JVM, Compose, Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Check (JVM, Compose desktop, lint)
        run: |
          set -o pipefail
          ./gradlew check --continue -Prasoi.android=false 2>&1 | tee build-check.log
      - name: Assemble Android
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleDebug 2>&1 | tee build-android.log
      - name: Assemble Android release (compiles the Firebase sign-in; unsigned, no Firebase settings)
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleRelease -Prasoi.apiBaseUrl=https://api.example.invalid 2>&1 | tee build-android-release.log
      - name: Summarize failures
        if: failure()
        run: |
          grep -hE '^e: |^w: |FAILED|What went wrong' build-*.log | head -80 || true
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: check-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  ios:
    name: Build and test (iOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: iOS simulator tests
        run: |
          set -o pipefail
          ./gradlew iosSimulatorArm64Test -Prasoi.android=false -Prasoi.ios=true --continue 2>&1 | tee build-ios.log
      - name: Build iOS app
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build
      - name: Summarize failures
        if: failure()
        run: |
          grep -hE '^e: |^w: |FAILED|What went wrong|error:' build-*.log | head -80 || true
