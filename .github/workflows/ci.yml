name: CI

# Push only: the open pull request shows the same checks for its head commit, and listening to pull_request as well
# would run everything twice per commit (and queue twice on the single self-hosted runner).
on:
  push:
  workflow_dispatch:

concurrency:
  # Every pushed commit gets its own full result (milestone tags need one).
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

# Jobs run on GitHub-hosted runners. If the first job cannot start there (for example the account's minutes are used
# up), the others fall back to the self-hosted Mac runner (ADR 0025). The repository variables RASOI_RUNNER and
# RASOI_IOS_RUNNER (JSON label lists) force a choice; with both set, choose-runner is skipped instead of failing red.

jobs:
  choose-runner:
    name: Choose runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # When hosted minutes run out this job dies at once and the others fall back to the self-hosted runner. Its
    # failure is the expected signal, so it must not turn the whole run red.
    continue-on-error: true
    # Nothing to probe when both runners are forced.
    if: ${{ !(vars.RASOI_RUNNER && vars.RASOI_IOS_RUNNER) }}
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
      ios: ${{ steps.pick.outputs.ios }}
    steps:
      - id: pick
        run: |
          echo 'linux=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          echo 'ios=["macos-latest"]' >> "$GITHUB_OUTPUT"

  guard:
    name: Privacy and resource guards
    needs: choose-runner
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(vars.RASOI_RUNNER || needs.choose-runner.outputs.linux || '["self-hosted","macOS","ARM64"]') }}
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-no-real-invoices.sh
      - run: python3 scripts/check-compose-resources.py

  check:
    name: Build, lint and test (JVM, Compose, Android)
    needs: choose-runner
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(vars.RASOI_RUNNER || needs.choose-runner.outputs.linux || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # Installs the SDK command-line tools and accepts the licences; Gradle downloads the platform and build tools
      # it needs. The default package list asks for the obsolete 'tools' package and fails.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Screenshots are not verified on the self-hosted runner
        if: ${{ runner.environment == 'self-hosted' }}
        run: echo "::notice::Goldens are rendered on Linux (ADR 0025); verifyRoborazziJvm is skipped on this runner."
      - name: Docker is needed for the server tests
        run: docker info > /dev/null || { echo "::error::Docker is not running on this runner (Testcontainers needs it); see docs/ci.md"; exit 1; }
      - name: Check (JVM, Compose desktop, lint)
        run: |
          set -o pipefail
          ./gradlew check --continue -Prasoi.android=false -Prasoi.ios=false ${{ runner.environment == 'self-hosted' && '-x verifyRoborazziJvm' || '' }} 2>&1 | tee build-check.log
      # Firebase settings for the Android app, kept out of git (ADR 0024). Forks and Dependabot get no secrets, so
      # without it the app still builds and sign-in reports that Firebase is not configured.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json
          else
            echo "::notice::GOOGLE_SERVICES_JSON is not set; building without Firebase settings."
          fi
      - name: Assemble Android
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleDebug -Prasoi.ios=false 2>&1 | tee build-android.log
      # Signs with the upload key when the RASOI_KEYSTORE_* secrets exist (ADR 0024); forks and Dependabot get none and
      # build unsigned. The keystore lives in the runner's temp folder only for this step.
      - name: Assemble Android release
        env:
          RASOI_KEYSTORE_BASE64: ${{ secrets.RASOI_KEYSTORE_BASE64 }}
          RASOI_KEYSTORE_PASSWORD: ${{ secrets.RASOI_KEYSTORE_PASSWORD }}
          RASOI_KEY_ALIAS: ${{ secrets.RASOI_KEY_ALIAS }}
          RASOI_KEY_PASSWORD: ${{ secrets.RASOI_KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.RASOI_API_BASE_URL || 'https://api.example.invalid' }}
        run: |
          set -o pipefail
          if [ -n "$RASOI_KEYSTORE_BASE64" ]; then
            export RASOI_KEYSTORE_FILE="$RUNNER_TEMP/rasoi-upload.jks"
            trap 'rm -f "$RASOI_KEYSTORE_FILE"' EXIT
            printf '%s' "$RASOI_KEYSTORE_BASE64" | base64 --decode > "$RASOI_KEYSTORE_FILE"
          else
            echo "::notice::RASOI_KEYSTORE_BASE64 is not set; the release build is unsigned."
          fi
          ./gradlew :androidApp:assembleRelease -Prasoi.ios=false -Prasoi.apiBaseUrl="$API_BASE_URL" 2>&1 | tee build-android-release.log
      # Only a build pointed at a real server is worth installing.
      - name: Upload release APK
        if: ${{ vars.RASOI_API_BASE_URL != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: rasoi-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
          retention-days: 14
      - name: Summarize failures
        if: failure()
        run: |
          grep -hE '^e: |^w: |FAILED|What went wrong' build-*.log | head -80 || true
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: check-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  ios:
    name: Build and test (iOS)
    needs: choose-runner
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(vars.RASOI_IOS_RUNNER || needs.choose-runner.outputs.ios || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Xcode is needed
        run: xcodebuild -version || { echo "::error::Xcode is not installed on this runner; see docs/ci.md"; exit 1; }
      - name: iOS simulator tests
        run: |
          set -o pipefail
          ./gradlew iosSimulatorArm64Test -Prasoi.android=false -Prasoi.ios=true --continue 2>&1 | tee build-ios.log
      - name: Build iOS app
        run: |
          command -v xcodegen > /dev/null || brew install xcodegen
          cd iosApp && xcodegen generate
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build
      - name: Summarize failures
        if: failure()
        run: |
          grep -hE '^e: |^w: |FAILED|What went wrong|error:' build-*.log | head -80 || true
