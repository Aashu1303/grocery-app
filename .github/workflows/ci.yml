name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  guard:
    name: Privacy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-no-real-invoices.sh

  check:
    name: Build, lint and test (JVM, Compose, Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check (JVM, Compose desktop, lint)
        run: ./gradlew check --continue -Prasoi.android=false
      - name: Assemble Android
        run: ./gradlew :androidApp:assembleDebug
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  ios:
    name: Build and test (iOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: iOS simulator tests
        run: ./gradlew iosSimulatorArm64Test -Prasoi.android=false -Prasoi.ios=true --continue
      - name: Build iOS app
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build
