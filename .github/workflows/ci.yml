name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  # Every pushed commit gets a full result (milestone tags need one); superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

# Jobs run on GitHub-hosted runners. If the first job cannot start there (for example the account's minutes are used
# up), the others fall back to the self-hosted Mac runner (ADR 0025). The repository variables RASOI_RUNNER and
# RASOI_IOS_RUNNER (JSON label lists) force a choice.

jobs:
  choose-runner:
    name: Choose runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
      ios: ${{ steps.pick.outputs.ios }}
    steps:
      - id: pick
        env:
          FORCED_LINUX: ${{ vars.RASOI_RUNNER }}
          FORCED_IOS: ${{ vars.RASOI_IOS_RUNNER }}
        run: |
          echo "linux=${FORCED_LINUX:-[\"ubuntu-latest\"]}" >> "$GITHUB_OUTPUT"
          echo "ios=${FORCED_IOS:-[\"macos-latest\"]}" >> "$GITHUB_OUTPUT"

  guard:
    name: Privacy and resource guards
    needs: choose-runner
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.choose-runner.outputs.linux || '["self-hosted","macOS","ARM64"]') }}
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-no-real-invoices.sh
      - run: python3 scripts/check-compose-resources.py

  check:
    name: Build, lint and test (JVM, Compose, Android)
    needs: choose-runner
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.choose-runner.outputs.linux || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v3
      - name: Screenshots are not verified on the self-hosted runner
        if: ${{ runner.environment == 'self-hosted' }}
        run: echo "::notice::Goldens are rendered on Linux (ADR 0025); verifyRoborazziJvm is skipped on this runner."
      - name: Docker is needed for the server tests
        run: docker info > /dev/null || { echo "::error::Docker is not running on this runner (Testcontainers needs it); see docs/ci.md"; exit 1; }
      - name: Check (JVM, Compose desktop, lint)
        run: |
          set -o pipefail
          ./gradlew check --continue -Prasoi.android=false -Prasoi.ios=false ${{ runner.environment == 'self-hosted' && '-x verifyRoborazziJvm' || '' }} 2>&1 | tee build-check.log
      - name: Assemble Android
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleDebug -Prasoi.ios=false 2>&1 | tee build-android.log
      - name: Assemble Android release (compiles the Firebase sign-in; unsigned, no Firebase settings)
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleRelease -Prasoi.ios=false -Prasoi.apiBaseUrl=https://api.example.invalid 2>&1 | tee build-android-release.log
      - name: Summarize failures
        if: failure()
        run: |
          grep -hE '^e: |^w: |FAILED|What went wrong' build-*.log | head -80 || true
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: check-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  ios:
    name: Build and test (iOS)
    needs: choose-runner
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.choose-runner.outputs.ios || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Xcode is needed
        run: xcodebuild -version || { echo "::error::Xcode is not installed on this runner; see docs/ci.md"; exit 1; }
      - name: iOS simulator tests
        run: |
          set -o pipefail
          ./gradlew iosSimulatorArm64Test -Prasoi.android=false -Prasoi.ios=true --continue 2>&1 | tee build-ios.log
      - name: Build iOS app
        run: |
          command -v xcodegen > /dev/null || brew install xcodegen
          cd iosApp && xcodegen generate
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build
      - name: Summarize failures
        if: failure()
        run: |
          grep -hE '^e: |^w: |FAILED|What went wrong|error:' build-*.log | head -80 || true
